# Throwaway experiment: builds windows_exporter with WiX (installer/) and with
# msi-builder (its examples/windows_exporter/msi.yaml) and compares both on a
# disposable runner. Not meant for main.
name: msi-builder compare

on:
  push:
    branches:
      - claude/project-thread-fa5uby
  workflow_dispatch:
    inputs:
      msi_builder_ref:
        description: msi-builder ref
        default: main

permissions: {}

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MSI_BUILDER_REF: ${{ inputs.msi_builder_ref || 'claude/project-thread-fa5uby' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jkroepke/msi-builder
          ref: ${{ env.MSI_BUILDER_REF }}
          path: msi-builder
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false

      - name: Build windows_exporter.exe
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location cmd/windows_exporter
          go run github.com/tc-hib/go-winres@v0.3.3 make --product-version=0.90.0.1000 --file-version=0.90.0.1000 --arch=amd64
          if ($LASTEXITCODE) { throw 'go-winres failed' }
          Pop-Location
          New-Item -ItemType Directory -Force cmp | Out-Null
          go build -o cmp\windows_exporter.exe ./cmd/windows_exporter
          if ($LASTEXITCODE) { throw 'go build failed' }

      - name: Build msi-builder
        working-directory: msi-builder
        env:
          GOTOOLCHAIN: auto
        run: |
          go build -o ..\cmp\msi-builder.exe ./cmd/msi-builder
          if ($LASTEXITCODE) { throw 'go build failed' }

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Ui.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Build packages
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($v in '0.90.0', '0.91.0', '0.92.0') {
            .\installer\build.ps1 -PathToExecutable cmp\windows_exporter.exe -Version $v -Arch amd64
            Move-Item -Force "installer\windows_exporter-$v-amd64.msi" "cmp\ref-$v.msi"
            .\cmp\msi-builder.exe build --var VERSION=$v --var ARCH=x64 --var BINARY=$PWD\cmp\windows_exporter.exe --var ICON=$PWD\installer\icon.ico -o "cmp\ours-$v.msi" msi-builder\examples\windows_exporter\msi.yaml
            if ($LASTEXITCODE) { throw "msi-builder build $v failed" }
          }
          New-Item -ItemType Directory -Force out | Out-Null
          .\cmp\msi-builder.exe inspect cmp\ref-0.90.0.msi > out\ref-tables.txt
          .\cmp\msi-builder.exe inspect cmp\ours-0.90.0.msi > out\ours-tables.txt
          Get-ChildItem cmp

      - name: Compare installs
        timeout-minutes: 30
        run: .\hack\msi-builder-compare\compare.ps1 -Dir cmp -Out out

      - name: windows_exporter installer test on the msi-builder package
        if: ${{ always() }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prev = (gh release view --repo prometheus-community/windows_exporter --json tagName --jq .tagName) -replace '^v', ''
          if ([Version]($prev -replace '^([0-9\.]+).*$','$1') -lt [Version]'0.32.0') { $prev = '0.32.0-beta.1' }
          Write-Host "previous release $prev"
          .\tools\test-installer.ps1 -Msi cmp\ours-0.90.0.msi -UpgradeMsi cmp\ours-0.91.0.msi -Executable cmp\windows_exporter.exe -PreviousVersion $prev -WorkDir "$PWD\out\installer-test"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare
          path: |
            out
            cmp\*.msi
