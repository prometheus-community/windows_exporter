name: Domain lab

on:
  workflow_call:

permissions: {}

jobs:
  domain:
    name: AD and enterprise CA in Hyper-V
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: golang=go
          go-version: '1.27.1'

      - name: Compile Go tests and exporter for the guest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force domain-tests/tools | Out-Null
          foreach ($collector in "ad", "adcs") {
              go test -c -race -o "domain-tests/$collector.test.exe" "./internal/collector/$collector"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          go build -trimpath -o domain-tests/windows_exporter.exe ./cmd/windows_exporter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools/end-to-end-test.ps1 domain-tests/tools/

      - name: Provision domain guest and run Go tests
        shell: powershell
        run: ./tools/domain-lab.ps1

      - name: Summarize domain feature tests
        if: ${{ always() }}
        shell: pwsh
        env:
          WINDOWS_EXPORTER_TEST_COLLECTORS: ad,adcs
          WINDOWS_TEST_OS: Windows Server 2025 domain guest
        run: |
          $testExitCode = 1
          if (Test-Path domain-test-exit-code.txt) {
              $testExitCode = [int](Get-Content domain-test-exit-code.txt)
          }
          ./tools/test-summary.ps1 -TestExitCode $testExitCode

      - name: Upload domain lab diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-lab-results
          path: |
            test-output.txt
            test-results.jsonl
            feature-summary.md
            ${{ runner.temp }}/domain-lab/*.log
            ${{ runner.temp }}/domain-lab/*.png
            ${{ runner.temp }}/domain-lab/timings.json
          if-no-files-found: ignore

      - name: Stop domain guest
        if: ${{ always() }}
        shell: powershell
        run: |
          Get-VM -Name CIADDC -ErrorAction SilentlyContinue |
              Stop-VM -TurnOff -Force -ErrorAction SilentlyContinue
