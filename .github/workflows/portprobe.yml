name: Ephemeral port probe

on:
  push:
    branches:
      - claude/project-thread-g4ilxe

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Build
        shell: powershell
        run: go build -o portprobe.exe ./tools/portprobe/

      - name: System info
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version) build $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR) arch $env:PROCESSOR_ARCHITECTURE"
          foreach ($f in "$env:windir\System32\drivers\tcpip.sys","$env:windir\System32\drivers\netio.sys","$env:windir\System32\drivers\nsiproxy.sys","$env:windir\System32\nsi.dll","$env:windir\System32\netiohlp.dll") {
            $i = Get-Item $f
            "{0} {1} {2}" -f $i.Name, $i.VersionInfo.FileVersionRaw, (Get-FileHash $f -Algorithm SHA256).Hash
          }
          whoami /groups | Select-String "High Mandatory|S-1-5-32-544"
          Get-NetTCPSetting | Format-Table SettingName, DynamicPortRangeStartPort, DynamicPortRangeNumberOfPorts, AutoReusePortRangeStartPort, AutoReusePortRangeNumberOfPorts, AutoReusePortRangeMaxConnections, AutoReusePortRangeMaxConnectionsPerPort -AutoSize | Out-String -Width 300
          Get-NetUDPSetting | Format-List
          Get-NetCompartment | Format-Table -AutoSize
          Get-Counter -ListSet TCPv4,TCPv6,UDPv4,UDPv6 | ForEach-Object { $_.CounterSetName; $_.Counter }
          logman query providers Microsoft-Windows-TCPIP | Select-Object -First 60

      - name: Auto-reuse port range (TCP object 34), authorized for disposable runners only
        shell: powershell
        run: |
          $fmt = { Get-NetTCPSetting | Format-Table SettingName, DynamicPortRangeStartPort, DynamicPortRangeNumberOfPorts, AutoReusePortRangeStartPort, AutoReusePortRangeNumberOfPorts, AutoReusePortRangeMaxConnections, AutoReusePortRangeMaxConnectionsPerPort -AutoSize | Out-String -Width 300 }
          "===== before"
          & $fmt
          Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetTCPSetting | Select-Object SettingName, AutoReusePortRangeStartPort, AutoReusePortRangeNumberOfPorts, AutoReusePortRangeMaxConnections, AutoReusePortRangeMaxConnectionsPerPort | Export-Clixml "$env:RUNNER_TEMP\tcpsetting.xml"
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters | Out-String -Width 300
          netsh int ipv4 set dynamicport tcp start=50000 num=255 store=active
          .\portprobe.exe obj34
          .\portprobe.exe -start 50000 -count 255 capacity
          foreach ($case in @(@(50100, 50), @(60000, 100))) {
            "===== set auto-reuse range start=$($case[0]) count=$($case[1])"
            foreach ($name in "Internet", "Datacenter", "InternetCustom", "DatacenterCustom") {
              try { Set-NetTCPSetting -SettingName $name -AutoReusePortRangeStartPort $case[0] -AutoReusePortRangeNumberOfPorts $case[1] -ErrorAction Stop; "set $name ok" } catch { "set $name failed: $_" }
            }
            & $fmt
            .\portprobe.exe obj34
            netsh int ipv4 show dynamicport tcp
            netsh int ipv4 show excludedportrange tcp
            .\portprobe.exe -start 50000 -count 255 capacity
            .\portprobe.exe -start 50000 -count 255 unicast
            .\portprobe.exe -start 50000 -count 255 validate
          }
          "===== max connections via CIM"
          foreach ($i in Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetTCPSetting) {
            try { Set-CimInstance -InputObject $i -Property @{AutoReusePortRangeMaxConnections = [uint32]1234; AutoReusePortRangeMaxConnectionsPerPort = [uint32]7} -ErrorAction Stop; "cim set $($i.SettingName) ok" } catch { "cim set $($i.SettingName) failed: $_" }
          }
          & $fmt
          .\portprobe.exe obj34
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters | Out-String -Width 300

      - name: Restore auto-reuse range
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\tcpsetting.xml")) { "no saved settings, nothing changed"; exit 0 }
          $orig = Import-Clixml "$env:RUNNER_TEMP\tcpsetting.xml"
          foreach ($i in Get-CimInstance -Namespace root/StandardCimv2 -ClassName MSFT_NetTCPSetting) {
            $o = $orig | Where-Object SettingName -eq $i.SettingName
            if (-not $o) { continue }
            $props = @{}
            foreach ($p in "AutoReusePortRangeStartPort", "AutoReusePortRangeNumberOfPorts", "AutoReusePortRangeMaxConnections", "AutoReusePortRangeMaxConnectionsPerPort") { if ($i.$p -ne $o.$p) { $props[$p] = $o.$p } }
            if ($props.Count -eq 0) { continue }
            try { Set-CimInstance -InputObject $i -Property $props -ErrorAction Stop; "restored $($i.SettingName)" } catch { "restore $($i.SettingName) failed: $_" }
          }
          Get-NetTCPSetting | Format-Table SettingName, AutoReusePortRangeStartPort, AutoReusePortRangeNumberOfPorts, AutoReusePortRangeMaxConnections, AutoReusePortRangeMaxConnectionsPerPort -AutoSize | Out-String -Width 300

      - name: Restore range
        if: always()
        shell: powershell
        run: |
          foreach ($af in "ipv4","ipv6") { foreach ($p in "tcp","udp") { netsh int $af set dynamicport $p start=49152 num=16384 store=active } }
          foreach ($af in "ipv4","ipv6") { foreach ($p in "tcp","udp") { netsh int $af show dynamicport $p } }
