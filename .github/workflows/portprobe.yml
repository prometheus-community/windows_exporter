name: Ephemeral port probe

on:
  push:
    branches:
      - claude/project-thread-g4ilxe

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Build
        shell: powershell
        run: go build -o portprobe.exe ./tools/portprobe/

      - name: System info
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version) build $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR) arch $env:PROCESSOR_ARCHITECTURE"
          foreach ($f in "$env:windir\System32\drivers\tcpip.sys","$env:windir\System32\drivers\netio.sys","$env:windir\System32\drivers\nsiproxy.sys","$env:windir\System32\nsi.dll","$env:windir\System32\netiohlp.dll") {
            $i = Get-Item $f
            "{0} {1} {2}" -f $i.Name, $i.VersionInfo.FileVersionRaw, (Get-FileHash $f -Algorithm SHA256).Hash
          }
          whoami /groups | Select-String "High Mandatory|S-1-5-32-544"
          Get-NetTCPSetting | Format-Table SettingName, DynamicPortRangeStartPort, DynamicPortRangeNumberOfPorts, AutoReusePortRangeStartPort, AutoReusePortRangeNumberOfPorts, AutoReusePortRangeMaxConnections, AutoReusePortRangeMaxConnectionsPerPort -AutoSize | Out-String -Width 300
          Get-NetUDPSetting | Format-List
          Get-NetCompartment | Format-Table -AutoSize
          Get-Counter -ListSet TCPv4,TCPv6,UDPv4,UDPv6 | ForEach-Object { $_.CounterSetName; $_.Counter }
          logman query providers Microsoft-Windows-TCPIP | Select-Object -First 60

      - name: Hold, bench and iphlpapi exports, default range
        shell: powershell
        run: |
          .\portprobe.exe hold
          .\portprobe.exe bench

      - name: NSI with a restricted (non-admin) token
        shell: powershell
        run: |
          .\portprobe.exe restricted
          $pw = "Pp-" + [guid]::NewGuid().ToString("N").Substring(0, 8) + "!a1"
          net user probeuser $pw /add | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential("probeuser", (ConvertTo-SecureString $pw -AsPlainText -Force))
          icacls $env:RUNNER_TEMP /grant "probeuser:(OI)(CI)M" | Out-Null
          icacls (Get-Location).Path /grant "probeuser:(OI)(CI)RX" /T /Q | Out-Null
          try {
            Start-Process -FilePath (Resolve-Path .\portprobe.exe).Path -ArgumentList "restricted" -Credential $cred -Wait -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\pu.txt" -WorkingDirectory $env:RUNNER_TEMP
            "===== as probeuser (standard user logon)"
            Get-Content "$env:RUNNER_TEMP\pu.txt"
          } catch { "Start-Process as probeuser failed: $_" }
          net user probeuser /delete | Out-Null

      - name: Small range, SO_REUSE_UNICASTPORT
        shell: powershell
        run: |
          netsh int ipv4 set dynamicport tcp start=50000 num=255 store=active
          netsh int ipv4 set dynamicport udp start=50000 num=255 store=active
          .\portprobe.exe -start 50000 -count 255 unicast
          .\portprobe.exe -start 50000 -count 255 validate
          netsh int ipv4 add excludedportrange protocol=tcp startport=50200 numberofports=15 store=active
          netsh int ipv4 add excludedportrange protocol=udp startport=50210 numberofports=7 store=active
          .\portprobe.exe -start 50000 -count 255 validate
          netsh int ipv4 delete excludedportrange protocol=tcp startport=50200 numberofports=15 store=active
          netsh int ipv4 delete excludedportrange protocol=udp startport=50210 numberofports=7 store=active

      - name: Restore range
        if: always()
        shell: powershell
        run: |
          foreach ($af in "ipv4","ipv6") { foreach ($p in "tcp","udp") { netsh int $af set dynamicport $p start=49152 num=16384 store=active } }
          foreach ($af in "ipv4","ipv6") { foreach ($p in "tcp","udp") { netsh int $af show dynamicport $p } }
