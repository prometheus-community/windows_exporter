name: CI

# Trigger on pull requests and pushes to master branch where Go-related files
# have been changed.
on:
  push:
    branches:
      - master
      - next
      - main
      - "0.*"
      - "1.*"
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

env:
  VERSION_PROMU: '0.17.0'
  VERSION_PROMTOOL: '2.43.0'

permissions: {}

jobs:
  build:
    runs-on: windows-2025
    environment: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: '0'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: golang=go
          go-version: '1.27.1'

      - name: Build
        run: |
          $ErrorActionPreference = "Stop"

          $Version = git describe --tags --always
          $Version = $Version -replace 'v', ''
          # '+' symbols are invalid characters in image tags
          $Version = $Version -replace '\+', '_'
          $Version | Set-Content VERSION -PassThru

          make build-all

          # GH requires all files to have different names, so add version/arch to differentiate
          foreach($Arch in "amd64", "arm64") {
            Move-Item output\$Arch\windows_exporter.exe output\windows_exporter-$Version-$Arch.exe
          }

          Get-ChildItem -Path output

      - name: Sign build artifacts
        if: ${{ (github.event_name != 'pull_request' && github.repository == 'prometheus-community/windows_exporter') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'prometheus-community/windows_exporter') }}
        run: |
          $ErrorActionPreference = "Stop"
          $Version = Get-Content VERSION

          $b64      = $env:CODE_SIGN_KEY
          $filename = 'windows_exporter_CodeSign.pfx'

          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes($filename, $bytes)

          $basePath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $latestSigntool = Get-ChildItem -Path $basePath -Directory |
          Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } |
          Sort-Object { [Version]$_.Name } -Descending |
          Select-Object -First 1 |
          ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" }

          if (Test-Path $latestSigntool) {
            Write-Output $latestSigntool
          } else {
            Write-Output "signtool.exe not found"
          }

          foreach($Arch in "amd64", "arm64") {
            & $latestSigntool sign /v /tr "http://timestamp.digicert.com" /d "Prometheus exporter for Windows machines" /td SHA256 /fd SHA256 /a /f "windows_exporter_CodeSign.pfx" /p $env:CODE_SIGN_PASSWORD "output\windows_exporter-$Version-$Arch.exe"
          }

          rm windows_exporter_CodeSign.pfx
        env:
          CODE_SIGN_KEY: ${{ secrets.CODE_SIGN_KEY }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2

      - name: Install WiX extensions
        run: |
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Ui.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Install Build deps
        run: |
          Invoke-WebRequest -Uri https://github.com/prometheus/promu/releases/download/v$($Env:VERSION_PROMU)/promu-$($Env:VERSION_PROMU).windows-amd64.zip -OutFile promu-$($Env:VERSION_PROMU).windows-amd64.zip
          Expand-Archive -Path promu-$($Env:VERSION_PROMU).windows-amd64.zip -DestinationPath .
          Copy-Item -Path promu-$($Env:VERSION_PROMU).windows-amd64\promu.exe -Destination "$(go env GOPATH)\bin"

          # GOPATH\bin dir must be added to PATH else the `promu` commands won't be found
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Release Artifacts
        run: |
          $ErrorActionPreference = "Stop"
          $Version = Get-Content VERSION

          foreach($Arch in "amd64", "arm64") {
            Write-Host "Building windows_exporter $Version msi for $Arch"
            .\installer\build.ps1 -PathToExecutable .\output\windows_exporter-$Version-$Arch.exe -Version $Version -Arch "$Arch"
          }

          Move-Item installer\*.msi output\
          Get-ChildItem -Path output\

      - name: Sign installer artifacts
        if: ${{ (github.event_name != 'pull_request' && github.repository == 'prometheus-community/windows_exporter') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'prometheus-community/windows_exporter') }}
        run: |
          $ErrorActionPreference = "Stop"
          $Version = Get-Content VERSION

          $b64      = $env:CODE_SIGN_KEY
          $filename = 'windows_exporter_CodeSign.pfx'

          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes($filename, $bytes)

          $basePath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $latestSigntool = Get-ChildItem -Path $basePath -Directory |
          Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } |
          Sort-Object { [Version]$_.Name } -Descending |
          Select-Object -First 1 |
          ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" }

          if (Test-Path $latestSigntool) {
            Write-Output $latestSigntool
          } else {
            Write-Output "signtool.exe not found"
          }

          foreach($Arch in "amd64", "arm64") {
            & $latestSigntool sign /v /tr "http://timestamp.digicert.com" /d "Prometheus exporter for Windows machines" /td SHA256 /fd SHA256 /a /f "windows_exporter_CodeSign.pfx" /p $env:CODE_SIGN_PASSWORD "output\windows_exporter-$Version-$Arch.msi"
          }

          rm windows_exporter_CodeSign.pfx
        env:
          CODE_SIGN_KEY: ${{ secrets.CODE_SIGN_KEY }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}

      - name: Generate checksums
        run: |
          promu checksum output
          cat output\sha256sums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows_exporter_binaries
          path: |
            output\windows_exporter-*.exe
            output\windows_exporter-*.msi
            output\sha256sums.txt

  docker:
    name: Build docker images
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: '0'

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows_exporter_binaries

      - name: Login to Docker Hub
        if: ${{ github.repository == 'prometheus-community/windows_exporter' && github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to quay.io
        if: ${{ github.repository == 'prometheus-community/windows_exporter' && github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_LOGIN }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Login to GitHub container registry
        if: ${{ github.repository == 'prometheus-community/windows_exporter' && github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/prometheus-community/windows-exporter
            docker.io/prometheuscommunity/windows-exporter
            quay.io/prometheuscommunity/windows-exporter
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=windows_exporter
            org.opencontainers.image.description=A Prometheus exporter for Windows machines.
            org.opencontainers.image.vendor=The Prometheus Community
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.repository == 'prometheus-community/windows_exporter' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: windows/amd64
          annotations: ${{ steps.meta.outputs.labels }}

  publish:
    if: github.repository == 'prometheus-community/windows_exporter' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs:
      - build
      - test
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows_exporter_binaries

      - name: Publish Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            windows_exporter-*.exe \
            windows_exporter-*.msi \
            sha256sums.txt

  test:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: golang=go
          go-version: '1.27.1'

      - name: Test
        run: make test

      - name: Install e2e deps
        run: |
          Invoke-WebRequest -Uri https://github.com/prometheus/promu/releases/download/v$($Env:VERSION_PROMU)/promu-$($Env:VERSION_PROMU).windows-amd64.zip -OutFile promu-$($Env:VERSION_PROMU).windows-amd64.zip
          Expand-Archive -Path promu-$($Env:VERSION_PROMU).windows-amd64.zip -DestinationPath .
          Copy-Item -Path promu-$($Env:VERSION_PROMU).windows-amd64\promu.exe -Destination "$(go env GOPATH)\bin"

          # GOPATH\bin dir must be appended to PATH else the `promu` command won't be found
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: e2e Test
        run: make e2e-test

  integration-tests:
    name: integration tests
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Setup storage pool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $existingDiskIds = @(Get-PhysicalDisk | ForEach-Object ObjectId)
          $disk1 = Join-Path $env:RUNNER_TEMP "storage-pool-1.vhdx"
          $disk2 = Join-Path $env:RUNNER_TEMP "storage-pool-2.vhdx"
          $diskpartScript = Join-Path $env:RUNNER_TEMP "storage-pool-diskpart.txt"

          @"
          create vdisk file="$disk1" maximum=10240 type=expandable
          attach vdisk
          create vdisk file="$disk2" maximum=10240 type=expandable
          attach vdisk
          "@ | Set-Content -Path $diskpartScript -Encoding ascii

          diskpart /s $diskpartScript
          Update-HostStorageCache

          $newDisks = @(Get-PhysicalDisk | Where-Object { $_.ObjectId -notin $existingDiskIds })
          $newDisks | Format-Table FriendlyName, DeviceId, MediaType, BusType, Size, CanPool, CannotPoolReason

          $poolableDisks = @($newDisks | Where-Object CanPool)

          if ($poolableDisks.Count -ne 2) {
              throw "Expected two poolable VHDX disks, found $($poolableDisks.Count)"
          }

          New-StoragePool `
              -FriendlyName "GitHubActions" `
              -StorageSubsystemFriendlyName "Windows Storage*" `
              -PhysicalDisks $poolableDisks

          $pool = Get-StoragePool -FriendlyName "GitHubActions" -ErrorAction Stop
          $pool | Format-List FriendlyName, HealthStatus, OperationalStatus, Size, AllocatedSize

          if ($pool.IsPrimordial) {
              throw "Expected a concrete storage pool"
          }

      - name: Start Hyper-V VM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          systeminfo | Select-String "Hyper-V Requirements" -Context 0,4

          Get-WindowsFeature Hyper-V* |
              Format-Table DisplayName, Name, InstallState

          Get-Module -ListAvailable Hyper-V |
              Format-Table Name, Version, Path

          Import-Module Hyper-V

          Get-Service vmms | Format-List Name, Status, StartType
          Start-Service vmms

          New-VM `
              -Name "GitHubActions" `
              -Generation 2 `
              -MemoryStartupBytes 256MB `
              -NoVHD

          Start-VM -Name "GitHubActions"

          $vm = Get-VM -Name "GitHubActions"
          $vm | Format-List Name, State, Status, Generation, Uptime

          if ($vm.State -ne "Running") {
              throw "Expected Hyper-V VM to be running, got $($vm.State)"
          }

      - name: Setup DNS and DHCP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $result = Install-WindowsFeature DNS,DHCP,Containers -IncludeManagementTools
          $result | Format-List Success, RestartNeeded, ExitCode, FeatureResult

          Get-WindowsFeature DNS,DHCP,Containers |
              Format-Table DisplayName, Name, InstallState

          Start-Service DNS
          Start-Service DHCPServer

          (Get-Service DNS).WaitForStatus("Running", [TimeSpan]::FromSeconds(30))
          (Get-Service DHCPServer).WaitForStatus("Running", [TimeSpan]::FromSeconds(30))

          Get-Service DNS,DHCPServer |
              Format-Table Name, Status, StartType

          Add-DnsServerPrimaryZone `
              -Name "ci.contoso.com" `
              -ZoneFile "ci.contoso.com.dns"

          Add-DnsServerResourceRecordA `
              -Name "test" `
              -ZoneName "ci.contoso.com" `
              -IPv4Address "192.0.2.10"

          $zone = Get-DnsServerZone -Name "ci.contoso.com" -ErrorAction Stop
          $zone | Format-List ZoneName, ZoneType, IsDsIntegrated

          Get-DnsServerResourceRecord `
              -ZoneName "ci.contoso.com" `
              -Name "test" `
              -RRType A

          Add-DhcpServerv4Scope `
              -Name "GitHubActions" `
              -StartRange "192.0.2.100" `
              -EndRange "192.0.2.200" `
              -SubnetMask "255.255.255.0" `
              -State Active

          $scope = Get-DhcpServerv4Scope `
              -ScopeId "192.0.2.0" `
              -ErrorAction Stop

          $scope | Format-List ScopeId, Name, State, StartRange, EndRange, SubnetMask

          if ($zone.ZoneType -ne "Primary") {
              throw "Expected a primary DNS zone"
          }

          if ($scope.State -ne "Active") {
              throw "Expected an active DHCP scope"
          }

      - name: Setup containerd and static pods
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $containerdVersion = "2.4.1"
          $criToolsVersion = "1.37.0"
          $cniVersion = "1.9.1"
          $kubernetesVersion = "v1.37.1"
          $criEndpoint = "npipe:////./pipe/containerd-containerd"

          $containerdInstaller = Join-Path $env:RUNNER_TEMP "Install-Containerd.ps1"
          Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/kubernetes-sigs/sig-windows-tools/877cfb9ae91749ab9d73314337504ac962d6f90e/hostprocess/Install-Containerd.ps1" `
              -OutFile $containerdInstaller

          & $containerdInstaller `
              -ContainerDVersion $containerdVersion `
              -crictlVersion $criToolsVersion

          $containerdPath = Join-Path $env:ProgramFiles "containerd"
          $containerd = Join-Path $containerdPath "containerd.exe"
          $crictl = Join-Path $containerdPath "crictl.exe"

          if (-not (Test-Path $containerd)) {
              throw "containerd was not installed; the Containers feature may require a reboot"
          }

          $cniBinPath = "C:\opt\cni\bin"
          $cniConfigPath = "C:\etc\cni\net.d"
          New-Item -ItemType Directory -Force -Path $cniBinPath,$cniConfigPath | Out-Null

          $cniArchive = Join-Path $env:RUNNER_TEMP "cni-plugins-windows-amd64-v$($cniVersion).tgz"
          Invoke-WebRequest `
              -Uri "https://github.com/containernetworking/plugins/releases/download/v$($cniVersion)/cni-plugins-windows-amd64-v$($cniVersion).tgz" `
              -OutFile $cniArchive

          tar.exe -xzf $cniArchive -C $cniBinPath

          @'
          {
            "cniVersion": "0.3.1",
            "name": "ci",
            "type": "win-bridge",
            "ipam": {
              "type": "host-local",
              "subnet": "192.168.255.0/24",
              "gateway": "192.168.255.1"
            }
          }
          '@ | Set-Content `
              -Path (Join-Path $cniConfigPath "10-ci.conf") `
              -Encoding ascii

          Restart-Service containerd
          (Get-Service containerd).WaitForStatus("Running", [TimeSpan]::FromSeconds(30))

          & $crictl --runtime-endpoint $criEndpoint info
          if ($LASTEXITCODE -ne 0) {
              throw "containerd CRI endpoint is not ready"
          }

          $kubeDir = "C:\k"
          $manifestDir = Join-Path $kubeDir "manifests"
          New-Item -ItemType Directory -Force -Path $kubeDir,$manifestDir | Out-Null

          $kubelet = Join-Path $kubeDir "kubelet.exe"
          $kubeletUri = "https://dl.k8s.io/release/$kubernetesVersion/bin/windows/amd64/kubelet.exe"
          Invoke-WebRequest -Uri $kubeletUri -OutFile $kubelet
          Invoke-WebRequest -Uri "$kubeletUri.sha256" -OutFile "$kubelet.sha256"

          $expectedHash = (Get-Content "$kubelet.sha256").Trim().Split()[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $kubelet).Hash.ToLowerInvariant()

          if ($actualHash -ne $expectedHash) {
              throw "kubelet SHA256 mismatch"
          }

          @'
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          authentication:
            webhook:
              enabled: false
          authorization:
            mode: AlwaysAllow
          enableServer: false
          address: 127.0.0.1
          readOnlyPort: 10255
          resolvConf: ""
          staticPodPath: C:/k/manifests
          containerRuntimeEndpoint: npipe:////./pipe/containerd-containerd
          '@ | Set-Content `
              -Path (Join-Path $kubeDir "kubelet.yaml") `
              -Encoding ascii

          @'
          apiVersion: v1
          kind: Pod
          metadata:
            name: hostprocess
          spec:
            hostNetwork: true
            securityContext:
              windowsOptions:
                hostProcess: true
                runAsUserName: 'NT AUTHORITY\SYSTEM'
            containers:
              - name: hostprocess
                image: mcr.microsoft.com/oss/kubernetes/windows-host-process-containers-base-image:v1.0.0
                imagePullPolicy: IfNotPresent
                command:
                  - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
                  - -NoLogo
                  - -NonInteractive
                  - -Command
                  - 'while ($true) { Start-Sleep -Seconds 3600 }'
          '@ | Set-Content `
              -Path (Join-Path $manifestDir "hostprocess.yaml") `
              -Encoding ascii

          @'
          apiVersion: v1
          kind: Pod
          metadata:
            name: process-isolated
          spec:
            containers:
              - name: servercore
                image: mcr.microsoft.com/windows/servercore:ltsc2025
                imagePullPolicy: IfNotPresent
                command:
                  - powershell.exe
                  - -NoLogo
                  - -NonInteractive
                  - -Command
                  - 'while ($true) { Start-Sleep -Seconds 3600 }'
          '@ | Set-Content `
              -Path (Join-Path $manifestDir "process-isolated.yaml") `
              -Encoding ascii

          & $crictl --runtime-endpoint $criEndpoint pull mcr.microsoft.com/oss/kubernetes/windows-host-process-containers-base-image:v1.0.0
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to pull HostProcess base image"
          }

          & $crictl --runtime-endpoint $criEndpoint pull mcr.microsoft.com/windows/servercore:ltsc2025
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to pull Windows Server 2025 base image"
          }

          $kubeletStdout = Join-Path $env:RUNNER_TEMP "kubelet.stdout.log"
          $kubeletStderr = Join-Path $env:RUNNER_TEMP "kubelet.stderr.log"

          $kubeletProcess = Start-Process `
              -FilePath $kubelet `
              -ArgumentList "--config=C:\k\kubelet.yaml","--v=4" `
              -RedirectStandardOutput $kubeletStdout `
              -RedirectStandardError $kubeletStderr `
              -PassThru

          $deadline = (Get-Date).AddMinutes(10)
          $running = $false

          do {
              if ($kubeletProcess.HasExited) {
                  Get-Content $kubeletStdout -ErrorAction SilentlyContinue
                  Get-Content $kubeletStderr -ErrorAction SilentlyContinue
                  throw "kubelet exited with code $($kubeletProcess.ExitCode)"
              }

              try {
                  $pods = Invoke-RestMethod -Uri "http://127.0.0.1:10255/pods" -TimeoutSec 5
                  $hostProcessPod = $pods.items | Where-Object { $_.metadata.name -eq "hostprocess-$env:COMPUTERNAME".ToLowerInvariant() -or $_.metadata.name -eq "hostprocess" }
                  $processPod = $pods.items | Where-Object { $_.metadata.name -eq "process-isolated-$env:COMPUTERNAME".ToLowerInvariant() -or $_.metadata.name -eq "process-isolated" }

                  if ($hostProcessPod.status.phase -eq "Running" -and $processPod.status.phase -eq "Running") {
                      $running = $true
                      break
                  }
              }
              catch {
                  Write-Host "Waiting for kubelet API and static pods..."
              }

              Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          & $crictl --runtime-endpoint $criEndpoint pods
          & $crictl --runtime-endpoint $criEndpoint ps -a

          if (-not $running) {
              Get-Content $kubeletStdout -ErrorAction SilentlyContinue
              Get-Content $kubeletStderr -ErrorAction SilentlyContinue
              throw "Static pods did not reach Running state"
          }

  promtool:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: golang=go
          go-version: '1.27.1'

      - name: Install promtool
        run: |
          Invoke-WebRequest -Uri https://github.com/prometheus/prometheus/releases/download/v$($Env:VERSION_PROMTOOL)/prometheus-$($Env:VERSION_PROMTOOL).windows-amd64.zip -OutFile prometheus-$($Env:VERSION_PROMTOOL).windows-amd64.zip
          Expand-Archive -Path prometheus-$($Env:VERSION_PROMTOOL).windows-amd64.zip -DestinationPath .
          Copy-Item -Path prometheus-$($Env:VERSION_PROMTOOL).windows-amd64\promtool.exe -Destination "$(go env GOPATH)\bin"

          Invoke-WebRequest -Uri https://github.com/prometheus/promu/releases/download/v$($Env:VERSION_PROMU)/promu-$($Env:VERSION_PROMU).windows-amd64.zip -OutFile promu-$($Env:VERSION_PROMU).windows-amd64.zip
          Expand-Archive -Path promu-$($Env:VERSION_PROMU).windows-amd64.zip -DestinationPath .
          Copy-Item -Path promu-$($Env:VERSION_PROMU).windows-amd64\promu.exe -Destination "$(go env GOPATH)\bin"

          # GOPATH\bin dir must be appended to PATH else the `promu` command won't be found
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Promtool
        run: make promtool

      - name: Upload windows_exporter.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows_exporter.amd64.exe
          path: 'windows_exporter.exe'
          retention-days: 7
          if-no-files-found: error

  lint:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      # `gofmt` linter run by golangci-lint fails on CRLF line endings (the default for Windows)
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # renovate: golang=go
          go-version: '1.27.1'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: github=golangci/golangci-lint
          version: v2.13.2
          args: "--max-same-issues=0"

  super-linter:
    name: Super Linter
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: 'false'

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI_STATUS: false
          LINTER_RULES_PATH: .github/linters
          GITHUB_ACTIONS_ZIZMOR_CONFIG_FILE: ../../../github/workspace/.github/linters/zizmor.yml
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_HTML: true
          VALIDATE_JSON: true
          # VALIDATE_MARKDOWN: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_PYTHON: true
          VALIDATE_RENOVATE: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_SPELL_CODESPELL: true
          # VALIDATE_XML: true
          # VALIDATE_YAML: true
