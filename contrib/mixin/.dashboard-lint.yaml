# Keep exceptions scoped to the existing sample dashboard and panels.
exclusions:
  target-instance-rule:
    reason: Fleet panels intentionally span instances; per-host panels use an exact matcher for the single-select instance variable.
    entries:
      - dashboard: Windows Exporter
  template-instance-rule:
    reason: Per-host tabs require one instance, so the instance variable has neither multi-select nor an All value.
    entries:
      - dashboard: Windows Exporter
  template-job-rule:
    reason: Grafana expands All to the discovered job values rather than using a custom .+ wildcard.
    entries:
      - dashboard: Windows Exporter
  uneditable-dashboard:
    reason: This sample dashboard is editable so users can adapt it to their environment.
    entries:
      - dashboard: Windows Exporter
  panel-units-rule:
    reason: This table displays service names and states; the numeric query value is hidden.
    entries:
      - dashboard: Windows Exporter
        panel: Automatic services not running
