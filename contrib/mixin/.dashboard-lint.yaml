# Keep exceptions scoped to the existing sample dashboard and panels.
exclusions:
  target-instance-rule:
    reason: Fleet panels intentionally span instances; per-host panels use an exact matcher for the single-select instance variable.
    entries:
      - dashboard: Windows Exporter
  template-instance-rule:
    reason: Per-host tabs require one instance, so the instance variable has neither multi-select nor an All value.
    entries:
      - dashboard: Windows Exporter
  template-job-rule:
    reason: Grafana expands All to the discovered job values rather than using a custom .+ wildcard.
    entries:
      - dashboard: Windows Exporter
  uneditable-dashboard:
    reason: This sample dashboard is editable so users can adapt it to their environment.
    entries:
      - dashboard: Windows Exporter
  panel-units-rule:
    reason: This table displays service names and states; the numeric query value is hidden.
    entries:
      - dashboard: Windows Exporter
        panel: Automatic services not running
  panel-title-description-rule:
    reason: These existing panels have titles but no descriptions; new panels must include both.
    entries:
      - dashboard: Windows Exporter
        panel: Operating system
      - dashboard: Windows Exporter
        panel: CPUs
      - dashboard: Windows Exporter
        panel: RAM
      - dashboard: Windows Exporter
        panel: CPU busy
      - dashboard: Windows Exporter
        panel: Memory used
      - dashboard: Windows Exporter
        panel: CPU utilization
      - dashboard: Windows Exporter
        panel: Volumes
      - dashboard: Windows Exporter
        panel: Context switches and interrupts
      - dashboard: Windows Exporter
        panel: Processes and threads
      - dashboard: Windows Exporter
        panel: System calls and exceptions
      - dashboard: Windows Exporter
        panel: Volume usage
      - dashboard: Windows Exporter
        panel: Network errors and discards
      - dashboard: Windows Exporter
        panel: Running services
      - dashboard: Windows Exporter
        panel: Disabled services
      - dashboard: Windows Exporter
        panel: VMs in critical health
      - dashboard: Windows Exporter
        panel: Logical processors
      - dashboard: Windows Exporter
        panel: Virtual switch dropped packets
      - dashboard: Windows Exporter
        panel: Clock sync source
      - dashboard: Windows Exporter
        panel: Clock offset and NTP round-trip delay
      - dashboard: Windows Exporter
        panel: Samples per scrape
      - dashboard: Windows Exporter
        panel: Collectors
