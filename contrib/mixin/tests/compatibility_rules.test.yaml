rule_files:
  - ../../../docs/upgrade/0.32.prom
evaluation_interval: 1m

tests:
  - name: 0.32 metrics are published under their 0.31 names, units and labels
    interval: 1m
    input_series:
      - series: 'windows_mscluster_resource_restart_delay_seconds{job="w",instance="h:9182",type="SQL Server",resource="SQL",resource_group="G1"}'
        values: '0.5'
      - series: 'windows_hyperv_virtual_smb_open_files{job="w",instance="h:9182",vm="VM1"}'
        values: '3'
      - series: 'windows_cpu_core_frequency_hertz{job="w",instance="h:9182",core="0,0"}'
        values: '3600000000'
      - series: 'windows_cpu_time_seconds_total{job="w",instance="h:9182",core="0,0",mode="idle"}'
        values: '42'
      - series: 'windows_container_cpu_usage_kernelmode_seconds_total{job="w",instance="h:9182",container_id="c1"}'
        values: '7'
      - series: 'windows_exchange_workload_queued_tasks{job="w",instance="h:9182",workload="W1"}'
        values: '5'
    promql_expr_test:
      - expr: windows_mscluster_resource_restart_delay
        eval_time: 0
        exp_samples:
          - labels: 'windows_mscluster_resource_restart_delay{job="w",instance="h:9182",type="SQL Server",name="SQL",owner_group="G1"}'
            value: 500
      - expr: windows_hyperv_virtual_smb_current_open_file_count
        eval_time: 0
        exp_samples:
          - labels: 'windows_hyperv_virtual_smb_current_open_file_count{job="w",instance="h:9182",exported_instance="VM1"}'
            value: 3
      - expr: windows_cpu_core_frequency_mhz
        eval_time: 0
        exp_samples:
          - labels: 'windows_cpu_core_frequency_mhz{job="w",instance="h:9182",core="0,0"}'
            value: 3600
      - expr: windows_cpu_time_total
        eval_time: 0
        exp_samples:
          - labels: 'windows_cpu_time_total{job="w",instance="h:9182",core="0,0",mode="idle"}'
            value: 42
      - expr: windows_container_cpu_usage_seconds_kernelmode
        eval_time: 0
        exp_samples:
          - labels: 'windows_container_cpu_usage_seconds_kernelmode{job="w",instance="h:9182",container_id="c1"}'
            value: 7
      - expr: windows_container_cpu_usage_seconds_kernelmode_total
        eval_time: 0
        exp_samples:
          - labels: 'windows_container_cpu_usage_seconds_kernelmode_total{job="w",instance="h:9182",container_id="c1"}'
            value: 7
      - expr: windows_exchange_workload_queued_tasks_total
        eval_time: 0
        exp_samples:
          - labels: 'windows_exchange_workload_queued_tasks_total{job="w",instance="h:9182",name="W1"}'
            value: 5
