            exp_annotations:
              runbook_url: https://prometheus-community.github.io/windows_exporter/runbooks/windowshostrebooted/
              summary: Windows host has rebooted
              description: 'host:9182 rebooted 2m 0s ago.'
      - alertname: WindowsHostRebooted
