  - name: Host reboot fires once for the first ten minutes after a new boot time
    interval: 1m
    input_series:
      - series: 'windows_system_boot_time_timestamp{job="windows_exporter", instance="host:9182"}'
        values: '-100000x10 540x15'
      - series: 'windows_system_boot_time_timestamp{job="windows_exporter", instance="steady:9182"}'
        values: '-100000x25'
    alert_rule_test:
      - {alertname: WindowsHostRebooted, eval_time: 10m, exp_alerts: []}
      - alertname: WindowsHostRebooted
        eval_time: 11m
        exp_alerts:
