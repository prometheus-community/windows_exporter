# Alerts of the opt-in collectors, rendered with tests/config.libsonnet.
rule_files:
  - custom_rules.yaml
  - custom_alerts.yaml
evaluation_interval: 1m
group_eval_order:
  - windows-exporter-recording
  - windows-memory
  - windows-disk
  - windows-system
  - windows-time
  - windows-scheduled-task
  - windows-update
  - windows-hyperv
  - windows-cluster
  - windows-storage-spaces
  - windows-dhcp
  - windows-dns

tests:
  - name: Page file usage fires above the custom threshold and resolves after keep_firing_for
    interval: 1m
    input_series:
      - series: 'windows_pagefile_free_bytes{job="windows-custom", instance="host:9182", cluster="test", file="C:\\pagefile.sys"}'
        values: '20x19 50x10'
      - series: 'windows_pagefile_limit_bytes{job="windows-custom", instance="host:9182", cluster="test", file="C:\\pagefile.sys"}'
        values: '100x30'
      - series: 'windows_pagefile_free_bytes{job="windows-custom", instance="host:9182", cluster="test", file="D:\\pagefile.sys"}'
        values: '30x30'
      - series: 'windows_pagefile_limit_bytes{job="windows-custom", instance="host:9182", cluster="test", file="D:\\pagefile.sys"}'
        values: '100x30'
      - series: 'windows_pagefile_free_bytes{job="windows-custom", instance="host:9182", cluster="test", file="E:\\pagefile.sys"}'
        values: '0x30'
      - series: 'windows_pagefile_limit_bytes{job="windows-custom", instance="host:9182", cluster="test", file="E:\\pagefile.sys"}'
        values: '0x30'
    alert_rule_test:
      - {alertname: WindowsPagefileAlmostFull, eval_time: 14m, exp_alerts: []}
      - alertname: WindowsPagefileAlmostFull
        eval_time: 15m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, file: 'C:\pagefile.sys', severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowspagefilealmostfull/
              summary: Windows page file is almost full
              description: 'Page file C:\pagefile.sys on host:9182 has been more than 75% in use for 15 minutes.'
      - alertname: WindowsPagefileAlmostFull
        eval_time: 24m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, file: 'C:\pagefile.sys', severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowspagefilealmostfull/
              summary: Windows page file is almost full
              description: 'Page file C:\pagefile.sys on host:9182 has been more than 75% in use for 15 minutes.'
      - {alertname: WindowsPagefileAlmostFull, eval_time: 25m, exp_alerts: []}

  - name: Disk drive status reports the status the drive has, resolves at once and skips Unknown, and the license alert waits an hour
    interval: 1m
    input_series:
      - series: 'windows_diskdrive_status{job="windows-custom", instance="host:9182", cluster="test", device_id="\\\\.\\PHYSICALDRIVE0", status="OK"}'
        values: '0x9 1x10'
      - series: 'windows_diskdrive_status{job="windows-custom", instance="host:9182", cluster="test", device_id="\\\\.\\PHYSICALDRIVE0", status="Pred Fail"}'
        values: '1x9 0x10'
      - series: 'windows_diskdrive_status{job="windows-custom", instance="host:9182", cluster="test", device_id="\\\\.\\PHYSICALDRIVE2", status="OK"}'
        values: '0x20'
      - series: 'windows_diskdrive_status{job="windows-custom", instance="host:9182", cluster="test", device_id="\\\\.\\PHYSICALDRIVE2", status="Unknown"}'
        values: '1x20'
      - series: 'windows_diskdrive_status{job="windows-custom", instance="host:9182", cluster="test", device_id="\\\\.\\PHYSICALDRIVE1", status="OK"}'
        values: '1x10'
      - series: 'windows_diskdrive_status{job="windows-custom", instance="host:9182", cluster="test", device_id="\\\\.\\PHYSICALDRIVE1", status="Pred Fail"}'
        values: '0x10'
      - series: 'windows_license_status{job="windows-custom", instance="host:9182", cluster="test", state="genuine"}'
        values: '0x60'
      - series: 'windows_license_status{job="windows-custom", instance="host:9182", cluster="test", state="invalid_license"}'
        values: '1x60'
      - series: 'windows_license_status{job="windows-custom", instance="licensed:9182", cluster="test", state="genuine"}'
        values: '1x60'
      - series: 'windows_license_status{job="windows-custom", instance="licensed:9182", cluster="test", state="invalid_license"}'
        values: '0x60'
    alert_rule_test:
      - {alertname: WindowsDiskDriveNotOK, eval_time: 4m, exp_alerts: []}
      - alertname: WindowsDiskDriveNotOK
        eval_time: 5m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, device_id: '\\.\PHYSICALDRIVE0', status: Pred Fail, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsdiskdrivenotok/
              summary: Windows disk drive is not healthy
              description: 'Disk drive \\.\PHYSICALDRIVE0 on host:9182 has reported status Pred Fail for 5 minutes.'
      - alertname: WindowsDiskDriveNotOK
        eval_time: 9m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, device_id: '\\.\PHYSICALDRIVE0', status: Pred Fail, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsdiskdrivenotok/
              summary: Windows disk drive is not healthy
              description: 'Disk drive \\.\PHYSICALDRIVE0 on host:9182 has reported status Pred Fail for 5 minutes.'
      - {alertname: WindowsDiskDriveNotOK, eval_time: 10m, exp_alerts: []}
      - {alertname: WindowsLicenseNotGenuine, eval_time: 59m, exp_alerts: []}
      - alertname: WindowsLicenseNotGenuine
        eval_time: 60m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, state: invalid_license, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowslicensenotgenuine/
              summary: Windows license is not genuine
              description: 'Windows on host:9182 has reported license status invalid_license for 1 hour.'

  - name: Clock source alert names the local source and ignores NTP and domain sources
    interval: 1m
    input_series:
      - series: 'windows_time_clock_sync_source{job="windows-custom", instance="host:9182", cluster="test", type="Local CMOS Clock"}'
        values: '1x10'
      - series: 'windows_time_clock_sync_source{job="windows-custom", instance="host:9182", cluster="test", type="NTP"}'
        values: '0x10'
      - series: 'windows_time_clock_sync_source{job="windows-custom", instance="dc:9182", cluster="test", type="NT5DS"}'
        values: '1x10'
      - series: 'windows_time_clock_sync_source{job="windows-custom", instance="dc:9182", cluster="test", type="NoSync"}'
        values: '0x10'
    alert_rule_test:
      - {alertname: WindowsClockSourceLocal, eval_time: 9m, exp_alerts: []}
      - alertname: WindowsClockSourceLocal
        eval_time: 10m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, type: Local CMOS Clock, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclocksourcelocal/
              summary: Windows clock has no external time source
              description: 'Windows Time on host:9182 has used Local CMOS Clock as its clock source for 10 minutes.'

  - name: Clock sync alert names the failed result, ignores successful hosts and recovers
    interval: 1m
    input_series:
      - series: 'windows_time_sync_last_result{job="windows-custom", instance="host:9182", cluster="test", result="no_data"}'
        values: '1x60 0x5'
      - series: 'windows_time_sync_last_result{job="windows-custom", instance="host:9182", cluster="test", result="success"}'
        values: '0x60 1x5'
      - series: 'windows_time_sync_last_result{job="windows-custom", instance="ok:9182", cluster="test", result="no_data"}'
        values: '0x65'
      - series: 'windows_time_sync_last_result{job="windows-custom", instance="ok:9182", cluster="test", result="success"}'
        values: '1x65'
    alert_rule_test:
      - {alertname: WindowsClockSyncFailing, eval_time: 59m, exp_alerts: []}
      - alertname: WindowsClockSyncFailing
        eval_time: 60m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, result: no_data, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclocksyncfailing/
              summary: Windows clock synchronization fails
              description: 'The last synchronization attempt of Windows Time on host:9182 has ended with no_data for 1 hour.'
      - {alertname: WindowsClockSyncFailing, eval_time: 61m, exp_alerts: []}

  - name: Scheduled task alert fires for unmapped and terminated results after an hour and skips disabled and deselected tasks
    interval: 1m
    input_series:
      - series: 'windows_scheduled_task_last_result_status{job="windows-custom", instance="host:9182", cluster="test", task="/Backup", status="unknown"}'
        values: '1x60'
      - series: 'windows_scheduled_task_last_result_status{job="windows-custom", instance="host:9182", cluster="test", task="/Backup", status="success"}'
        values: '0x60'
      - series: 'windows_scheduled_task_last_result_status{job="windows-custom", instance="host:9182", cluster="test", task="/Cleanup", status="terminated"}'
        values: '1x60'
      - series: 'windows_scheduled_task_last_result_status{job="windows-custom", instance="host:9182", cluster="test", task="/Report", status="has_not_run"}'
        values: '1x60'
      - series: 'windows_scheduled_task_last_result_status{job="windows-custom", instance="host:9182", cluster="test", task="/Report", status="unknown"}'
        values: '0x60'
      - series: 'windows_scheduled_task_last_result_status{job="windows-custom", instance="host:9182", cluster="test", task="/Ignored/Flaky", status="unknown"}'
        values: '1x60'
      - series: 'windows_scheduled_task_last_result_status{job="windows-custom", instance="host:9182", cluster="test", task="/Retired", status="unknown"}'
        values: '1x60'
      - series: 'windows_scheduled_task_state{job="windows-custom", instance="host:9182", cluster="test", task="/Retired", state="disabled"}'
        values: '1x60'
      - series: 'windows_scheduled_task_state{job="windows-custom", instance="host:9182", cluster="test", task="/Retired", state="ready"}'
        values: '0x60'
      - series: 'windows_scheduled_task_state{job="windows-custom", instance="host:9182", cluster="test", task="/Backup", state="disabled"}'
        values: '0x60'
      - series: 'windows_scheduled_task_state{job="windows-custom", instance="host:9182", cluster="test", task="/Backup", state="ready"}'
        values: '1x60'
    alert_rule_test:
      - {alertname: WindowsScheduledTaskFailed, eval_time: 59m, exp_alerts: []}
      - alertname: WindowsScheduledTaskFailed
        eval_time: 60m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, task: /Backup, status: unknown, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsscheduledtaskfailed/
              summary: Windows scheduled task did not succeed
              description: 'The last run of task /Backup on host:9182 ended with result unknown, and the task has not succeeded in the hour since.'
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, task: /Cleanup, status: terminated, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsscheduledtaskfailed/
              summary: Windows scheduled task did not succeed
              description: 'The last run of task /Cleanup on host:9182 ended with result terminated, and the task has not succeeded in the hour since.'

  - name: Pending updates fire as info after the configured duration and count installations only
    interval: 1m
    input_series:
      - series: 'windows_update_pending_info{job="windows-custom", instance="host:9182", cluster="test", id="a", revision="1", category="Security Updates", severity="Critical", title="KB1", deployment_action="installation"}'
        values: '1x2880'
      - series: 'windows_update_pending_info{job="windows-custom", instance="host:9182", cluster="test", id="b", revision="1", category="Updates", severity="", title="KB2", deployment_action="installation"}'
        values: '1x2880'
      - series: 'windows_update_pending_info{job="windows-custom", instance="host:9182", cluster="test", id="c", revision="1", category="Updates", severity="", title="KB3", deployment_action="uninstallation"}'
        values: '1x2880'
      - series: 'windows_update_pending_info{job="windows-custom", instance="clean:9182", cluster="test", id="d", revision="1", category="Updates", severity="", title="KB4", deployment_action="uninstallation"}'
        values: '1x2880'
    alert_rule_test:
      - {alertname: WindowsUpdatesPending, eval_time: 47h, exp_alerts: []}
      - alertname: WindowsUpdatesPending
        eval_time: 48h
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'host:9182', cluster: test, deployment_action: installation, severity: info}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsupdatespending/
              summary: Windows updates are waiting for installation
              description: 'host:9182 has had 2 updates waiting for installation for 2d.'

  - name: Hyper-V alerts cover the WMI namespace and both replication health levels
    interval: 1m
    input_series:
      - series: 'windows_hyperv_wmi_health{job="windows-custom", instance="hv:9182", cluster="test"}'
        values: '0x15'
      - series: 'windows_hyperv_replica_vm_health{job="windows-custom", instance="hv:9182", cluster="test", vm="web", vm_id="1", relationship="primary"}'
        values: '3x15'
      - series: 'windows_hyperv_replica_vm_health{job="windows-custom", instance="hv:9182", cluster="test", vm="db", vm_id="2", relationship="extended"}'
        values: '2x15'
      - series: 'windows_hyperv_replica_vm_health{job="windows-custom", instance="hv:9182", cluster="test", vm="dev", vm_id="3", relationship="primary"}'
        values: '0x15'
    alert_rule_test:
      - {alertname: WindowsHyperVWMIUnhealthy, eval_time: 9m, exp_alerts: []}
      - alertname: WindowsHyperVWMIUnhealthy
        eval_time: 10m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'hv:9182', cluster: test, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowshypervwmiunhealthy/
              summary: Hyper-V WMI namespace is not responding
              description: 'The Hyper-V WMI namespace on hv:9182 has not responded for 10 minutes; Hyper-V metrics are missing.'
      - {alertname: WindowsHyperVReplicationCritical, eval_time: 4m, exp_alerts: []}
      - alertname: WindowsHyperVReplicationCritical
        eval_time: 5m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'hv:9182', cluster: test, vm: web, vm_id: '1', relationship: primary, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowshypervreplicationcritical/
              summary: Hyper-V replication is critical
              description: 'Replication of virtual machine web (primary) on hv:9182 has been in critical health for 5 minutes.'
      - {alertname: WindowsHyperVReplicationWarning, eval_time: 14m, exp_alerts: []}
      - alertname: WindowsHyperVReplicationWarning
        eval_time: 15m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'hv:9182', cluster: test, vm: db, vm_id: '2', relationship: extended, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowshypervreplicationwarning/
              summary: Hyper-V replication has a warning
              description: 'Replication of virtual machine db (extended) on hv:9182 has been in warning health for 15 minutes.'

  - name: Cluster alerts fire for down nodes, failed resources and groups, and nearly full shared volumes
    interval: 1m
    input_series:
      - series: 'windows_mscluster_node_state{job="windows-custom", instance="node1:9182", cluster="test", node="node2"}'
        values: '1x30'
      - series: 'windows_mscluster_node_state{job="windows-custom", instance="node1:9182", cluster="test", node="node1"}'
        values: '0x30'
      - series: 'windows_mscluster_node_state{job="windows-custom", instance="node3:9182", cluster="test", node="node2"}'
        values: '1x30'
      - series: 'windows_mscluster_resource_state{job="windows-custom", instance="node1:9182", cluster="test", type="IP Address", resource_group="SQL", resource="SQL IP"}'
        values: '4x30'
      - series: 'windows_mscluster_resource_state{job="windows-custom", instance="node1:9182", cluster="test", type="Network Name", resource_group="SQL", resource="SQL Name"}'
        values: '3x30'
      - series: 'windows_mscluster_resourcegroup_state{job="windows-custom", instance="node1:9182", cluster="test", resource_group="SQL"}'
        values: '2x30'
      - series: 'windows_mscluster_resourcegroup_state{job="windows-custom", instance="node1:9182", cluster="test", resource_group="Cluster Group"}'
        values: '1x30'
      - series: 'windows_mscluster_shared_volumes_free_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="Volume1", volume_guid="g1"}'
        values: '15x19 50x10'
      - series: 'windows_mscluster_shared_volumes_total_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="Volume1", volume_guid="g1"}'
        values: '100x30'
      - series: 'windows_mscluster_shared_volumes_free_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="Volume2", volume_guid="g2"}'
        values: '5x30'
      - series: 'windows_mscluster_shared_volumes_total_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="Volume2", volume_guid="g2"}'
        values: '100x30'
      - series: 'windows_mscluster_shared_volumes_free_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="ClusterPerformanceHistory", volume_guid="g3"}'
        values: '1x30'
      - series: 'windows_mscluster_shared_volumes_total_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="ClusterPerformanceHistory", volume_guid="g3"}'
        values: '100x30'
      - series: 'windows_mscluster_shared_volumes_free_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="Empty", volume_guid="g4"}'
        values: '0x30'
      - series: 'windows_mscluster_shared_volumes_total_bytes{job="windows-custom", instance="node1:9182", cluster="test", shared_volume="Empty", volume_guid="g4"}'
        values: '0x30'
    alert_rule_test:
      - {alertname: WindowsClusterNodeDown, eval_time: 4m, exp_alerts: []}
      - alertname: WindowsClusterNodeDown
        eval_time: 5m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, node: node2, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclusternodedown/
              summary: Failover cluster node is down
              description: 'Cluster node node2 has been down for 5 minutes, as reported by node1:9182.'
          - exp_labels: {job: windows-custom, instance: 'node3:9182', cluster: test, node: node2, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclusternodedown/
              summary: Failover cluster node is down
              description: 'Cluster node node2 has been down for 5 minutes, as reported by node3:9182.'
      - alertname: WindowsClusterResourceFailed
        eval_time: 5m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, type: IP Address, resource_group: SQL, resource: SQL IP, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclusterresourcefailed/
              summary: Failover cluster resource has failed
              description: 'Cluster resource SQL IP (IP Address) in group SQL has been in the failed state for 5 minutes, as reported by node1:9182.'
      - alertname: WindowsClusterResourceGroupFailed
        eval_time: 5m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, resource_group: SQL, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclusterresourcegroupfailed/
              summary: Failover cluster resource group has failed
              description: 'Cluster resource group SQL has been in the failed state for 5 minutes, as reported by node1:9182.'
      - {alertname: WindowsClusterSharedVolumeAlmostFull, eval_time: 14m, exp_alerts: []}
      - alertname: WindowsClusterSharedVolumeAlmostFull
        eval_time: 15m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume1, volume_guid: g1, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume1 has had less than 20% free space for 15 minutes, as reported by node1:9182.'
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume2, volume_guid: g2, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume2 has had less than 20% free space for 15 minutes, as reported by node1:9182.'
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume2, volume_guid: g2, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume2 has had less than 10% free space for 15 minutes, as reported by node1:9182.'
      - alertname: WindowsClusterSharedVolumeAlmostFull
        eval_time: 24m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume1, volume_guid: g1, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume1 has had less than 20% free space for 15 minutes, as reported by node1:9182.'
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume2, volume_guid: g2, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume2 has had less than 20% free space for 15 minutes, as reported by node1:9182.'
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume2, volume_guid: g2, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume2 has had less than 10% free space for 15 minutes, as reported by node1:9182.'
      - alertname: WindowsClusterSharedVolumeAlmostFull
        eval_time: 25m
        exp_alerts:
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume2, volume_guid: g2, severity: warning}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume2 has had less than 20% free space for 15 minutes, as reported by node1:9182.'
          - exp_labels: {job: windows-custom, instance: 'node1:9182', cluster: test, shared_volume: Volume2, volume_guid: g2, severity: page}
            exp_annotations:
              runbook_url: https://runbooks.example.com/windows/windowsclustersharedvolumealmostfull/
              summary: Cluster shared volume is almost full
              description: 'Cluster shared volume Volume2 has had less than 10% free space for 15 minutes, as reported by node1:9182.'

  - name: Storage Spaces alerts skip the primordial pool and separate warning from unhealthy
    interval: 1m
    input_series:
      - series: 'windows_storage_spaces_pool_health_status{job="windows-custom", instance="host:9182", cluster="test", pool="Pool A", unique_id="a"}'
        values: '2x15'
      - series: 'windows_storage_spaces_pool_info{job="windows-custom", instance="host:9182", cluster="test", pool="Pool A", unique_id="a", primordial="false"}'
        values: '1x15'
      - series: 'windows_storage_spaces_pool_health_status{job="windows-custom", instance="host:9182", cluster="test", pool="Pool B", unique_id="b"}'
        values: '1x15'
      - series: 'windows_storage_spaces_pool_info{job="windows-custom", instance="host:9182", cluster="test", pool="Pool B", unique_id="b", primordial="false"}'
        values: '1x15'
      - series: 'windows_storage_spaces_pool_health_status{job="windows-custom", instance="host:9182", cluster="test", pool="Primordial", unique_id="p"}'
        values: '2x15'
      - series: 'windows_storage_spaces_pool_info{job="windows-custom", instance="host:9182", cluster="test", pool="Primordial", unique_id="p", primordial="true"}'
        values: '1x15'
